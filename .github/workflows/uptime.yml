name: uptime
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min (GitHub may delay a few minutes)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./check.sh
      - name: Keepalive (GitHub disables schedules after 60 idle days)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if (( now - last > 25*86400 )); then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "chore: keepalive" && git push
          fi
